name: Frontend CI

on:
  push:
    paths: ['platform/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Upload Vitest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: platform/coverage/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify migration order
        run: |
          test -f drizzle/0000_cold_red_wolf.sql
          test -f drizzle/0001_big_scrambler.sql
          test -f drizzle/0002_dizzy_junta.sql
          test -f drizzle/0003_seed_inventory_warehouses.sql
          test -f drizzle/0004_inventory_invariants.sql

  container:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target runtime --tag net-commerce:${{ github.sha }} platform
