name: Commerce CI

on:
  push:
    paths: ['platform/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: commerce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify migration order
        run: |
          test -f drizzle/0000_cold_red_wolf.sql
          test -f drizzle/0001_big_scrambler.sql
          test -f drizzle/0002_dizzy_junta.sql
          test -f drizzle/0003_seed_inventory_warehouses.sql
          test -f drizzle/0004_inventory_invariants.sql

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target runtime --tag net-commerce:${{ github.sha }} platform
