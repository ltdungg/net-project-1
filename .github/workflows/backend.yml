name: Backend CI

on:
  push:
    paths: ['platform/backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['platform/backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: platform/backend/pom.xml
      - name: Run unit and integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload JUnit and JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            platform/backend/target/surefire-reports/
            platform/backend/target/failsafe-reports/
            platform/backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
