name: net-commerce

services:
  commerce:
    build:
      context: .
      target: runtime
    init: true
    ports:
      - '${COMMERCE_PORT:-8787}:8787'
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - commerce_state:/app/.wrangler
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  commerce_state:
